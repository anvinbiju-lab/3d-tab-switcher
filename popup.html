<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Tab Switcher Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 18px 20px;
      background: #0d1017;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .brand svg {
      width: 20px;
      height: 20px;
      color: #00e5ff;
      filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.6));
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 3px 8px;
      border-radius: 12px;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .card-box {
      background: rgba(22, 27, 38, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .shortcut-row:last-child {
      margin-bottom: 0;
    }

    .shortcut-label {
      font-size: 12px;
      color: #cbd5e1;
    }

    .select-input {
      background: #161b26;
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #00e5ff;
      font-weight: 600;
      font-size: 12px;
      border-radius: 6px;
      padding: 5px 8px;
      outline: none;
      cursor: pointer;
    }

    .select-input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }

    .key-recorder-btn {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: #00e5ff;
      font-weight: 700;
      font-size: 12px;
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .key-recorder-btn:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .key-recorder-btn.recording {
      background: rgba(255, 85, 85, 0.2);
      border-color: #ff5555;
      color: #ff5555;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }

    .toggle-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 10px;
      cursor: pointer;
    }

    .toggle-row input[type="checkbox"] {
      margin-top: 2px;
      accent-color: #00e5ff;
      cursor: pointer;
      width: 15px;
      height: 15px;
    }

    .toggle-content {
      flex: 1;
    }

    .toggle-title {
      font-size: 12px;
      font-weight: 500;
      color: #e2e8f0;
      line-height: 1.3;
    }

    .toggle-desc {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
      line-height: 1.3;
    }

    .btn-secondary {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 500;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      text-decoration: none;
      margin-top: 6px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
      border: none;
      color: #040914;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5);
    }

    .hint-box {
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.18);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 8px;
    }

    .hint-box kbd {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #00e5ff;
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 10px;
      font-family: inherit;
      font-weight: 600;
    }

    .status-toast {
      text-align: center;
      font-size: 11px;
      color: #00e5ff;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      height: 14px;
    }

    .status-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>3D Tab Switcher</span>
    </div>
    <span class="badge">V1.0</span>
  </div>

  <!-- In-Page Shortcut Configuration -->
  <div class="section">
    <div class="section-title">Shortcut & Navigation</div>
    <div class="card-box">
      <div class="shortcut-row">
        <span class="shortcut-label">Modifier Key</span>
        <select id="modifierSelect" class="select-input">
          <option value="Alt">Alt</option>
          <option value="Ctrl">Ctrl</option>
          <option value="Meta">Cmd / Win</option>
        </select>
      </div>

      <div class="shortcut-row">
        <span class="shortcut-label">Switch & Cycle Key</span>
        <button id="recordKeyBtn" class="key-recorder-btn" title="Click and press any letter/key to bind">
          <span id="currentKeyDisplay">Q</span>
        </button>
      </div>

      <label class="toggle-row">
        <input type="checkbox" id="releaseToSwitchCheckbox" checked />
        <div class="toggle-content">
          <div class="toggle-title">Switch on Modifier Release</div>
          <div class="toggle-desc">Hold <strong id="modNameDesc">Alt</strong>, tap assigned key to cycle through tabs, and release to switch (Alt+Tab style).</div>
        </div>
      </label>

      <label class="toggle-row">
        <input type="checkbox" id="autoAdvanceCheckbox" checked />
        <div class="toggle-content">
          <div class="toggle-title">First Press Pre-selects Next Tab</div>
          <div class="toggle-desc">Immediately queues the 2nd tab on first press so a single quick tap switches to your last tab.</div>
        </div>
      </label>

      <div class="hint-box">
        Tip: Press <kbd id="hintMod">Alt</kbd> + <kbd id="hintKey">Q</kbd> repeatedly to cycle without touching arrow keys!
      </div>
    </div>
  </div>

  <!-- Browser-Level Shortcuts -->
  <div class="section">
    <div class="section-title">Browser Section Shortcuts</div>
    <div class="card-box">
      <p style="font-size: 11px; color: #94a3b8; line-height: 1.4; margin-bottom: 8px;">
        To configure the global browser shortcut (assigned in Chrome's keyboard shortcuts page):
      </p>
      <button id="openShortcutsBtn" class="btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span>Open chrome://extensions/shortcuts</span>
      </button>
    </div>
  </div>

  <!-- Test Trigger Button -->
  <button id="testLaunchBtn" class="btn-primary">
    <span>Launch Switcher Now</span>
  </button>

  <div id="statusToast" class="status-toast">Settings saved!</div>

  <script src="popup.js"></script>
</body>
</html>
